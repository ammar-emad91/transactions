<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171b">
<title>مولّد أرقام المعاملات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--bg:#14171b;--card:#1d2127;--tx:#fff;--mu:#d5dbe3;--bd:#3a424e;--ac:#4c8dff;--ok:#4cc27a;--er:#ff7b72;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,Tahoma,sans-serif;font-size:16px;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:0 0 10px;color:var(--mu);font-weight:500}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
select option{background:var(--card);color:#fff}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;width:100%;cursor:pointer}
.btn:disabled{opacity:.45}.ghost{background:transparent;border:1px solid var(--bd);width:auto;padding:8px 12px;font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.co{border:1px solid var(--bd);background:var(--bg);border-radius:10px;padding:12px 8px;cursor:pointer;font-weight:500}
.co.on{background:var(--ac);border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.big{font-size:44px;font-weight:700;text-align:center;letter-spacing:2px;direction:ltr;color:var(--ok);margin:6px 0}
.msg{text-align:center;color:var(--mu);font-size:14px}.err{color:var(--er)}
.day{border-top:1px solid var(--bd);padding:8px 0;font-size:14px}.day summary{cursor:pointer}
.nums{direction:ltr;color:var(--mu);margin-top:6px;word-spacing:8px;line-height:1.8}
.gap{height:8px}.three{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}
.three label{font-size:13px;color:var(--mu);display:block;margin-bottom:4px}.three select{direction:ltr}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="msg">جارٍ التحميل…</p></div>
<script src="app.js"></script>
<noscript><p style="color:#fff;text-align:center">يجب تفعيل JavaScript</p></noscript>
</body>
</html>
